name: LumiApp
options:
  bundleIdPrefix: com.lumi
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_LANGUAGE: ru
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: true
    INFOPLIST_KEY_CFBundleDisplayName: Lumi
    INFOPLIST_KEY_UILaunchScreen_Generation: true
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
    INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    INFOPLIST_KEY_NSHumanReadableCopyright: ""
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: false
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

targets:
  LumiApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: LumiApp
        excludes:
          - "Resources/**"
          - "LumiApp.entitlements"
          - "Core/Crisis/CrisisPatterns.example.json"
          - "Core/Crisis/README.md"
    resources:
      - path: LumiApp/Resources
    entitlements:
      path: LumiApp/LumiApp.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
        com.apple.security.application-groups: [group.com.lumi.app.shared]
    # Свой Info.plist (вместо генерируемого) нужен ровно ради
    # CFBundleURLTypes: схема lumi:// — это то, чем виджет открывает
    # нужный экран. Массив словарей через INFOPLIST_KEY_* не задаётся.
    info:
      path: LumiApp/Info.plist
      properties:
        CFBundleDisplayName: Lumi
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: com.lumi.app.deeplink
            CFBundleURLSchemes: [lumi]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lumi.app
        GENERATE_INFOPLIST_FILE: false
    dependencies:
      - target: LumiWidgetExtension
        embed: true

  LumiWidgetExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: LumiWidget
        excludes:
          - "Info.plist"
          - "Assets.xcassets/**"
      # Shared with the app target so the widgets read the same data and
      # the same design tokens instead of keeping a drifting copy.
      - path: LumiApp/Core/Models/UserProgress.swift
      - path: LumiApp/Core/Models/GamificationRules.swift
      - path: LumiApp/Core/Models/Course.swift
      - path: LumiApp/Core/Models/ExerciseKind.swift
      - path: LumiApp/Core/Models/JournalEntry.swift
      - path: LumiApp/Core/Models/RussianPlural.swift
      - path: LumiApp/Core/Persistence/AppGroup.swift
      - path: LumiApp/Core/Persistence/DeepLink.swift
      - path: LumiApp/Core/Persistence/CourseCatalog.swift
      - path: LumiApp/Core/Persistence/PersistenceController.swift
      - path: LumiApp/Core/DesignSystem/LumiColor.swift
      - path: LumiApp/Core/DesignSystem/LumiTypography.swift
    resources:
      - path: LumiWidget/Assets.xcassets
    entitlements:
      path: LumiWidget/LumiWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.lumi.app.shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lumi.app.widget
        PRODUCT_NAME: LumiWidgetExtension
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: LumiWidget/Info.plist
        # This target now has its own Assets.xcassets (skin-*.imageset);
        # unset the project-level app-icon/accent-color settings meant for
        # the main app so actool doesn't fail looking for sets that aren't
        # in this catalog.
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
    dependencies: []

  LumiAppTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: LumiAppTests
    dependencies:
      - target: LumiApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lumi.app.tests

schemes:
  LumiApp:
    build:
      targets:
        LumiApp: all
        LumiAppTests: [test]
    test:
      targets:
        - LumiAppTests
    run:
      config: Debug
